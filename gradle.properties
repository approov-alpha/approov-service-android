android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2

# The version of io.approov:service.android and the
# io.approov.gradle plugin. Releases publish both with
# -PapproovServiceVersion=<releaseVersion>; verifyVersionSync (part of verifyFast)
# fails when the CHANGELOG, the README snippets or that property disagree with it.
releaseVersion=3.7.0

# The OkHttp that io.approov:service.android compiles against and declares through the OkHttp BOM: the
# minimum an app gets, since Gradle resolves the highest OkHttp an app's dependencies ask for. README.md
# and ADVANCED.md name it, and verifyVersionSync fails when they disagree.
okhttpVersion=5.3.2

# The lowest OkHttp the library must run on: React Native's, since a React Native app declares the
# library with the OkHttp group excluded and keeps its own OkHttp 4. verifyOkHttp4Compatibility fails
# when the compiled library refers to an OkHttp class or member that this release does not have.
okhttpMinimumVersion=4.9.2
